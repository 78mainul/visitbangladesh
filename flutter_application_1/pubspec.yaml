name: flutter_application_1
description: "Visit Bangladesh App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # 🔥 Backend
  supabase_flutter: 2.3.4

  # 🗺️ Map (FREE OpenStreetMap)
  flutter_map: ^8.2.0
  latlong2: ^0.9.1

  # 🔗 Utilities
  url_launcher: ^6.3.2

  # 🎨 UI
  carousel_slider: ^5.1.1
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  
  # 🎫 NEW (ticket system pro upgrade)
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Glogo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/Glogo.png
    - assets/images/cover.png